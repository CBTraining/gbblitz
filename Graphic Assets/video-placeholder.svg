<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c10" />
      <stop offset="50%" stop-color="#121721" />
      <stop offset="100%" stop-color="#090c10" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#3387ff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#a142f4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090c10" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="googleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="33%" stop-color="#78C9FF" />
      <stop offset="66%" stop-color="#9B72CB" />
      <stop offset="100%" stop-color="#FF63A0" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#9B72CB" stop-opacity="0.4" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <rect width="600" height="400" fill="url(#centerGlow)" />

  <!-- Subtle Ambient Frame -->
  <rect x="30" y="25" width="540" height="350" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" opacity="0.6" />

  <!-- Central Play / Video Emblem Circle -->
  <g transform="translate(300, 180)">
    <!-- Soft pulsing halo -->
    <circle r="52" fill="#1b2230" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    <circle r="44" fill="url(#googleGrad)" opacity="0.16" filter="url(#softGlow)" />

    <!-- Play Arrow -->
    <path d="M-8,-18 L18,0 L-8,18 Z" fill="url(#googleGrad)" />

    <!-- Mini Gemini Sparkle at Top Right of Badge -->
    <path d="M22,-24 C20,-18 16,-14 10,-12 C16,-10 20,-6 22,0 C24,-6 28,-10 34,-12 C28,-14 24,-18 22,-24 Z" fill="url(#googleGrad)" />
  </g>

  <!-- Branding Lockup -->
  <text x="300" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff" letter-spacing="0.02em">
    Googlebook
  </text>
  <text x="300" y="298" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', Roboto, sans-serif" font-size="11" font-weight="500" fill="#9aa0a6" letter-spacing="0.08em">
    LAUNCH BLITZ • VIDEO PREVIEW
  </text>
</svg>
